<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abasolo → DE | Ficha técnica · El Whisky de México</title>
  <meta name="description" content="Ficha técnica de Abasolo, El Whisky de México: whisky de maíz ancestral (43% Alc. Vol.) de Jilotepec para Alemania. Proceso, clasificación arancelaria, precios, competencia, normas y empaque. ES · EN · DE.">
  <meta property="og:title" content="Abasolo → DE · Ficha técnica del producto">
  <meta property="og:description" content="Whisky de maíz ancestral · 43% Alc. Vol. País destino: Alemania · Marco comercial: TLCUEM.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preload" as="image" href="assets/botella-de.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caladea:ital,wght@0,400;0,700;1,400&family=Carlito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Colores y tipografías tomados de la ficha técnica (PowerPoint) */
    :root {
      --bg: #0A0A0A;
      --bg-2: #0F0E0C;
      --card: #151412;
      --line: #34302A;
      --gold: #C9A45C;
      --gold-light: #E6CF9A;
      --gold-dark: #8C6D32;
      --text: #F2EEE6;
      --muted: #A39E93;
      --serif: Cambria, Caladea, Georgia, "Times New Roman", serif;
      --sans: Calibri, Carlito, "Segoe UI", system-ui, sans-serif;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 76px; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 17px; line-height: 1.55; }
    h1, h2, h3 { font-family: var(--serif); font-weight: 400; line-height: 1.15; margin: 0 0 .5em; }
    a { color: inherit; }
    button { font: inherit; cursor: pointer; }
    img { max-width: 100%; display: block; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
    .label { font-size: .74rem; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); margin: 0 0 10px; }
    .muted { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
    .card.gold { border-color: var(--gold); }

    /* ---------- Header ---------- */
    header { position: sticky; top: 0; z-index: 40; background: rgba(10,10,10,.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .nav { display: flex; align-items: center; justify-content: space-between; gap: 14px; height: 64px; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .brand img { width: 26px; height: auto; }
    .brand span { font-size: .85rem; letter-spacing: .18em; color: var(--muted); }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-tag { font-size: .72rem; letter-spacing: .24em; text-transform: uppercase; color: var(--gold-dark); }
    .menu-btn { display: inline-flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 7px 14px; font-size: .88rem; }
    .menu-btn:hover { border-color: var(--gold); }
    .menu-btn i { width: 14px; height: 10px; border-top: 2px solid currentColor; border-bottom: 2px solid currentColor; position: relative; display: inline-block; }
    .menu-btn i::after { content: ""; position: absolute; left: 0; right: 0; top: 2px; border-top: 2px solid currentColor; }
    .langs { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; }
    .langs button { border: 0; background: transparent; color: var(--muted); font-size: .78rem; font-weight: 700; letter-spacing: .06em; padding: 5px 10px; border-radius: 999px; }
    .langs button[aria-pressed="true"] { background: var(--gold); color: var(--bg); }
    .menu-panel { position: fixed; top: 64px; right: 0; left: 0; z-index: 39; background: rgba(10,10,10,.97); border-bottom: 1px solid var(--line); padding: 20px 0 26px; max-height: calc(100vh - 64px); overflow-y: auto; }
    .menu-panel[hidden] { display: none; }
    .menu-panel ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2px 28px; }
    .menu-panel a { display: flex; gap: 14px; padding: 9px 0; text-decoration: none; border-bottom: 1px solid var(--line); }
    .menu-panel a:hover { color: var(--gold-light); }
    .menu-panel b { color: var(--gold); font-weight: 400; min-width: 22px; }

    /* ---------- Hero ---------- */
    .hero { position: relative; overflow: hidden; padding: 64px 0 56px; background: radial-gradient(ellipse at 78% 40%, rgba(201,164,92,.22), transparent 55%), var(--bg); }
    .hero-grid { display: grid; grid-template-columns: 1.35fr .65fr; gap: 32px; align-items: center; }
    .hero h1 { font-size: clamp(2.6rem, 8vw, 5rem); letter-spacing: .06em; display: flex; flex-wrap: wrap; align-items: center; gap: .1em .3em; margin-bottom: 10px; }
    .hero h1 .arrow { color: var(--gold); display: inline-block; animation: slide 2.4s ease-in-out infinite; }
    .hero h1 .de { display: inline-flex; align-items: center; gap: .22em; }
    @keyframes slide { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(.16em); } }
    .tagline { font-family: var(--serif); font-style: italic; font-size: clamp(1.3rem, 3vw, 1.8rem); color: var(--gold-light); margin: 0 0 18px; }
    .hero .sub { font-size: 1.12rem; color: var(--muted); max-width: 48ch; margin: 0 0 28px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 24px; border-radius: 999px; border: 1px solid transparent; font-weight: 700; text-decoration: none; transition: transform .15s, background .2s, border-color .2s; }
    .btn:hover { transform: translateY(-2px); }
    .btn-gold { background: var(--gold); color: var(--bg); }
    .btn-gold:hover { background: var(--gold-light); }
    .btn-line { border-color: var(--line); color: var(--text); background: none; }
    .btn-line:hover { border-color: var(--gold); }
    .hero-bottle { position: relative; display: flex; justify-content: center; }
    .hero-bottle::before { content: ""; position: absolute; inset: 15% 0 5%; background: radial-gradient(circle, rgba(201,164,92,.35), transparent 62%); filter: blur(24px); }
    .hero-bottle img { position: relative; height: min(600px, 74vh); width: auto; animation: float 7s ease-in-out infinite; filter: drop-shadow(0 30px 40px rgba(0,0,0,.6)); }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .flag { display: inline-block; width: .55em; height: .37em; border-radius: 2px; box-shadow: 0 0 0 1px rgba(255,255,255,.15); vertical-align: middle; }
    .flag-mx { background: linear-gradient(90deg, #006847 33.3%, #fff 33.3% 66.6%, #ce1126 66.6%); }
    .flag-de { background: linear-gradient(#000 33.3%, #dd0000 33.3% 66.6%, #ffce00 66.6%); }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin-top: 52px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .stat { background: var(--card); padding: 20px 12px; text-align: center; }
    .stat strong { display: block; font-family: var(--serif); font-weight: 400; font-size: clamp(1.5rem, 3.6vw, 2.2rem); color: var(--gold); white-space: nowrap; }
    .stat > span { display: block; font-size: .82rem; color: var(--muted); }

    /* ---------- TOC ---------- */
    .toc-grid { display: grid; grid-template-columns: .8fr 1.2fr; gap: 40px; align-items: start; }
    .toc-grid h2 { font-size: clamp(2.2rem, 5vw, 3.2rem); }
    .toc-grid .product { font-family: var(--serif); color: var(--gold-light); font-size: 1.25rem; margin: 22px 0 4px; }
    .toc ol { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 32px; }
    .toc li { break-inside: avoid; }
    .toc a { display: flex; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); text-decoration: none; transition: color .2s, padding .2s; }
    .toc a:hover { color: var(--gold-light); padding-left: 6px; }
    .toc b { color: var(--gold-dark); font-weight: 400; min-width: 22px; }

    /* ---------- Sections ---------- */
    section { padding: 84px 0; border-top: 1px solid var(--line); }
    section:nth-of-type(even) { background: var(--bg-2); }
    .sec-head { margin-bottom: 36px; max-width: 820px; }
    .sec-head h2 { font-size: clamp(1.9rem, 4.6vw, 2.8rem); }
    .sec-head .intro { color: var(--muted); margin: 0; font-size: 1.05rem; }
    .sources { margin-top: 28px; font-size: .8rem; color: var(--muted); opacity: .85; }
    .sources b { color: var(--gold-dark); font-weight: 700; }
    .note { margin-top: 18px; font-size: .92rem; color: var(--muted); }

    /* Rows (product) */
    .rows { list-style: none; margin: 0; padding: 0; }
    .rows li { display: grid; grid-template-columns: 48px 1fr; gap: 12px; padding: 18px 0; border-bottom: 1px solid var(--line); }
    .rows .n { font-family: var(--serif); color: var(--gold-dark); font-size: 1.05rem; }
    .rows .v { font-size: 1.1rem; }

    /* Cards grid */
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    .item { padding: 22px; transition: border-color .25s, transform .25s; }
    .item:hover { border-color: var(--gold-dark); transform: translateY(-3px); }
    .item .n { font-family: var(--serif); color: var(--gold); font-size: 1.35rem; margin-bottom: 12px; }
    .item h3 { font-family: var(--sans); font-size: .74rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
    .item h3.plain { font-size: 1.05rem; letter-spacing: 0; text-transform: none; color: var(--text); }
    .item p { margin: 0; color: var(--muted); font-size: .95rem; }

    /* Physical + presentations */
    .phys { display: grid; grid-template-columns: 300px 1fr; gap: 28px; align-items: start; }
    .pres { padding: 22px; text-align: center; position: sticky; top: 84px; }
    .pres-stage { height: 330px; display: flex; align-items: flex-end; justify-content: center; margin-bottom: 18px; background: radial-gradient(ellipse at 50% 80%, rgba(201,164,92,.18), transparent 65%); }
    .pres-stage img { height: 310px; width: auto; transform-origin: 50% 100%; transition: transform .6s cubic-bezier(.5, 1.6, .4, 1); filter: drop-shadow(0 18px 22px rgba(0,0,0,.6)); }
    .seg { display: flex; gap: 6px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; }
    .seg button { flex: 1; border: 0; background: none; color: var(--muted); font-weight: 700; padding: 8px 12px; border-radius: 999px; transition: background .2s, color .2s; white-space: nowrap; }
    .seg button[aria-pressed="true"] { background: var(--gold); color: var(--bg); }
    .pres-info { margin-top: 16px; text-align: left; }
    .pres-info p { margin: 0 0 6px; font-size: .95rem; }
    .pres-info .ok { color: var(--gold-light); }
    .pres-info .no { color: #e08a7a; }
    .chips { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-size: .8rem; color: var(--muted); text-align: left; }
    .chips span { display: inline-block; margin: 6px 4px 0 0; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--text); }
    .chips span.on { border-color: var(--gold); color: var(--gold); }

    /* Map */
    .region { display: grid; grid-template-columns: 1.1fr .9fr; gap: 28px; align-items: start; margin-bottom: 32px; }
    .map { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: #1c1a17; }
    .map img { width: 100%; height: auto; }
    .pin { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; border: 0; background: transparent; padding: 0; }
    .pin::before, .pin::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--gold); }
    .pin::after { animation: ping 2s ease-out infinite; }
    .pin[aria-pressed="true"]::before { background: rgba(201,164,92,.35); }
    @keyframes ping { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.9); opacity: 0; } }
    .pin-card { padding: 26px; }
    .pin-card h3 { font-size: 1.7rem; margin-bottom: 2px; }
    .pin-card .sub { color: var(--gold); margin: 0 0 12px; }
    .pin-card p { margin: 0; color: var(--muted); }
    .pin-tabs { margin-bottom: 14px; }
    .km { margin-top: 14px; padding: 18px 22px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
    .km strong { font-family: var(--serif); font-weight: 400; font-size: 2.2rem; color: var(--gold); }

    /* Tables */
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
    table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    th { text-align: left; font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 700; padding: 14px 16px; border-bottom: 1px solid var(--gold-dark); white-space: nowrap; }
    td { padding: 12px 16px; border-bottom: 1px solid var(--line); color: var(--muted); vertical-align: top; }
    td:first-child { color: var(--text); font-weight: 700; }
    tr:last-child td { border-bottom: 0; }
    tbody tr { transition: background .2s; }
    tbody tr:hover { background: rgba(201,164,92,.06); }
    td.num { white-space: nowrap; color: var(--text); }

    /* Process */
    .process { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
    .process .item { transition: opacity .3s, border-color .25s, transform .25s; }
    .process.only-key .item:not(.gold) { opacity: .25; }
    .key-legend { padding: 22px; background: none; border-style: dashed; }
    .key-legend p { margin: 0 0 14px; }

    /* Tariff */
    .tariff { display: grid; grid-template-columns: 1.35fr .65fr; gap: 28px; align-items: start; }
    .stairs { list-style: none; margin: 0; padding: 0; }
    .stairs li { display: grid; grid-template-columns: 110px auto 1fr; gap: 16px; align-items: center; padding: 8px 0; }
    .stairs .lv { font-size: .72rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
    .stairs .code { min-width: 120px; text-align: center; padding: 10px 16px; border: 1px solid var(--gold-dark); border-radius: 6px; font-family: var(--serif); font-size: 1.15rem; transition: background .2s, transform .2s, border-color .2s; }
    .stairs li:hover .code { transform: translateX(4px); border-color: var(--gold); }
    .stairs li.fill .code { background: var(--gold); color: var(--bg); border-color: var(--gold); }
    .stairs .d { font-size: .92rem; color: var(--muted); }
    .codes { padding: 26px; }
    .codes .block + .block { margin-top: 26px; padding-top: 26px; border-top: 1px solid var(--line); }
    .codes .big { font-family: var(--serif); font-size: clamp(1.7rem, 3.6vw, 2.2rem); margin: 4px 0 8px; letter-spacing: .02em; }
    .codes p { margin: 0 0 14px; color: var(--muted); font-size: .92rem; }
    .copy { border: 1px solid var(--line); background: none; color: var(--text); padding: 6px 16px; border-radius: 999px; font-size: .82rem; font-weight: 700; }
    .copy:hover { border-color: var(--gold); color: var(--gold); }

    /* Prices */
    .price-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 22px; }
    .price-cards .card { padding: 22px; }
    .price-cards strong { display: block; font-family: var(--serif); font-weight: 400; font-size: clamp(2rem, 4.4vw, 2.7rem); color: var(--gold-light); line-height: 1.1; margin: 4px 0 6px; }
    .price-cards span { font-size: .85rem; color: var(--muted); }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; margin-bottom: 14px; }

    /* Pros / cons */
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
    .two .card { padding: 22px; }
    .two p { margin: 0; color: var(--muted); }
    .two p.label { color: var(--gold); margin-bottom: 10px; }

    /* Duties */
    .duties { display: grid; grid-template-columns: .8fr 1.2fr; gap: 18px; align-items: stretch; }
    .zero { padding: 28px; display: flex; flex-direction: column; }
    .zero strong { font-family: var(--serif); font-weight: 400; font-size: clamp(4.5rem, 12vw, 7rem); color: var(--gold); line-height: 1; margin: 18px 0; }
    .zero p { color: var(--muted); margin: 0; }
    .zero p.label { color: var(--gold); }
    .zero .foot { margin-top: auto; padding-top: 18px; color: var(--text); }
    .pay { display: grid; gap: 10px; }
    .pay .card { padding: 18px 22px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
    .pay h3 { font-family: var(--sans); font-size: 1rem; font-weight: 700; margin: 0 0 2px; }
    .pay p { margin: 0; color: var(--muted); font-size: .9rem; }
    .pay p.label { color: var(--gold); font-size: .74rem; margin-bottom: 8px; }
    .pay .val { font-family: var(--serif); font-size: 1.35rem; color: var(--gold-light); white-space: nowrap; text-align: right; }
    .calc { margin-top: 18px; padding: 26px; display: grid; grid-template-columns: .9fr 1.1fr; gap: 28px; }
    .calc h3 { font-size: 1.5rem; }
    .phys > *, .region > *, .tariff > *, .duties > *, .calc > *, .hero-grid > *, .toc-grid > * { min-width: 0; }
    .field { display: block; margin-bottom: 14px; }
    .field span { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
    .field input[type="number"] { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 1.05rem; }
    .field input:focus { outline: none; border-color: var(--gold); }
    .check { display: flex; gap: 10px; align-items: flex-start; font-size: .92rem; color: var(--muted); cursor: pointer; }
    .check input { accent-color: var(--gold); width: 18px; height: 18px; margin-top: 2px; flex: none; }
    .calc table td:first-child { font-weight: 400; }
    .calc tr.total td { color: var(--gold-light); font-weight: 700; border-top: 1px solid var(--gold-dark); }

    /* Regulations */
    .alert { padding: 22px 24px; margin-bottom: 18px; display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; background: rgba(201,164,92,.08); }
    .alert .icon { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: var(--bg); font-weight: 700; font-size: 1.2rem; }
    .alert p { margin: 0; }
    .regs { grid-template-columns: repeat(3, 1fr); }
    .regs h3 { letter-spacing: .12em; }

    /* Packaging */
    .pack { grid-template-columns: repeat(3, 1fr); }
    .pack .item { position: relative; padding: 26px; }
    .pack .item h3.plain { font-family: var(--serif); font-size: 1.45rem; font-weight: 400; margin-bottom: 12px; }
    .pack ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: .95rem; }
    .pack li { margin-bottom: 4px; }
    .pack .thumb { position: absolute; top: 18px; right: 18px; height: 78px; width: auto; }

    /* Route */
    .route { margin-top: 18px; padding: 28px 24px; --p: 0; }
    .stops-wrap { position: relative; margin-top: 20px; }
    .stops { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); }
    .r-track, .r-fill { position: absolute; top: 21px; left: 12.5%; height: 2px; }
    .r-track { right: 12.5%; background: repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 14px); }
    .r-fill { width: calc(75% * var(--p)); background: var(--gold); transition: width .6s cubic-bezier(.6, 0, .2, 1); }
    .stop { position: relative; z-index: 1; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: 0; padding: 0 6px; color: inherit; text-align: center; }
    .stop .dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 2px solid var(--line); font-family: var(--serif); color: var(--muted); transition: all .3s; }
    .stop.done .dot { border-color: var(--gold); color: var(--gold); }
    .stop[aria-pressed="true"] .dot { background: var(--gold); border-color: var(--gold); color: var(--bg); transform: scale(1.12); box-shadow: 0 0 0 7px rgba(201,164,92,.18); }
    .stop:hover .dot { border-color: var(--gold); }
    .stop .name { font-weight: 700; font-size: .98rem; }
    .route-detail { margin: 24px 0 0; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); }
    .route-detail strong { color: var(--text); }
    .swap { animation: swap .4s ease; }
    @keyframes swap { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .card p.label { color: var(--gold); }

    /* Gallery */
    .gallery { display: grid; grid-template-columns: 1.25fr .75fr; gap: 28px; align-items: center; }
    .gallery > * { min-width: 0; }
    .gal-main { position: relative; height: 560px; display: flex; align-items: center; justify-content: center; padding: 30px 72px; overflow: hidden; touch-action: pan-y; user-select: none; background: radial-gradient(ellipse at 50% 62%, rgba(201,164,92,.24), transparent 62%), var(--card); }
    .gal-main img { max-height: 100%; max-width: 100%; width: auto; height: auto; filter: drop-shadow(0 24px 30px rgba(0,0,0,.6)); -webkit-user-drag: none; }
    .gal-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: rgba(10,10,10,.65); color: var(--text); font-size: 1.6rem; line-height: 1; display: grid; place-items: center; padding: 0 0 3px; transition: border-color .2s, color .2s; }
    .gal-nav:hover { border-color: var(--gold); color: var(--gold); }
    .gal-nav.prev { left: 14px; }
    .gal-nav.next { right: 14px; }

  let lang = store.get("lang") || (navigator.language || "es").slice(0, 2);
  if (!L[lang]) lang = "es";
  let t = L[lang];

  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const num = (v, d = 2) => v.toLocaleString(t.locale, { minimumFractionDigits: d, maximumFractionDigits: d });
  const eur = v => lang === "de" ? num(v) + " €" : "€" + num(v);
  const mxn = v => lang === "es" ? "$" + num(v) + " MXN" : lang === "en" ? "MX$" + num(v) : num(v) + " MXN";
  const liters = v => v.toLocaleString(t.locale) + " l";
  const sources = id => SOURCES[id] ? `<p class="sources"><b>${t.sources}:</b> ${SOURCES[id]}</p>` : "";
  const table = (head, rows) => `<div class="table-wrap"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  const pad = i => String(i + 1).padStart(2, "0");

  function head(i, intro = "") {
    return `<p class="label">${pad(i)}</p><h2>${t.h2[i]}</h2>${intro ? `<p class="intro">${intro}</p>` : ""}`;
  }

  const R = {
    s1() {
      return `<ul class="rows">${t.product.map((r, i) => `<li><span class="n">${pad(i)}</span><div><p class="label">${r[0]}</p><div class="v">${r[1]}</div></div></li>`).join("")}</ul>${sources("s1")}`;
    },
    s2() {
      const info = t.pres[state.pres].map(([txt, c]) => `<p class="${c}">${txt}</p>`).join("");
      return `<div class="phys">
        <div class="pres card">
          <p class="label">${t.pres_title}</p>
          <div class="pres-stage"><img src="assets/${state.pres === 750 ? "botella.webp" : "botella-de.webp"}" alt="Abasolo ${state.pres} ml" style="transform:scale(${state.pres === 750 ? 1 : .955})"></div>
          <div class="seg" role="group">${[750, 700].map(v => `<button data-pres="${v}" aria-pressed="${state.pres === v}">${v} ml</button>`).join("")}</div>
          <div class="pres-info">${info}</div>
          <div class="chips">${t.pres_chips}<br>${[0.5, 0.7, 1].map(v => `<span class="${v === 0.7 ? "on" : ""}">${liters(v)}</span>`).join("")}</div>
        </div>
        <div class="grid">${t.physical.map((r, i) => `<div class="card item"><div class="n">${pad(i)}</div><h3>${r[0]}</h3><p>${r[1]}</p></div>`).join("")}</div>
      </div>${sources("s2")}`;
    },
    s3() {
      const p = t.pins[state.pin];
      const pos = { jilotepec: [52.4, 19.2], calimaya: [48.9, 56.9] };
      return `<div class="region">
        <div class="map"><img src="assets/mapa.webp" alt="${t.map_alt}" width="1300" height="1192" loading="lazy">
          ${Object.keys(pos).map(k => `<button class="pin" data-pin="${k}" aria-pressed="${state.pin === k}" aria-label="${t.pins[k][0]}" style="left:${pos[k][0]}%;top:${pos[k][1]}%"></button>`).join("")}
        </div>
        <div>
          <p class="muted" style="margin:0 0 10px">${t.map_hint}</p>
          <div class="seg pin-tabs" role="group">${Object.keys(pos).map(k => `<button data-pin="${k}" aria-pressed="${state.pin === k}">${t.pins[k][0]}</button>`).join("")}</div>
          <div class="card pin-card swap"><h3>${p[0]}</h3><p class="sub">${p[1]}</p><p>${p[2]}</p></div>
          <div class="card km"><strong>≈ 87 km</strong><span class="muted">${t.km}</span></div>
        </div>
      </div>
      ${table(t.region_head, t.region)}${sources("s3")}`;
    },
    s4() {
      return `<div class="grid process ${state.onlyKey ? "only-key" : ""}">
        ${t.process.map((r, i) => `<div class="card item ${r[2] ? "gold" : ""}"><div class="n">${pad(i)}</div><h3 class="plain">${r[0]}</h3><p>${r[1]}</p></div>`).join("")}
        <div class="card key-legend"><p class="label">${t.key_title}</p><p class="muted">${t.key_text}</p><button class="btn btn-line" id="key-toggle" style="padding:8px 16px;font-size:.88rem">${state.onlyKey ? t.key_all : t.key_only}</button></div>
      </div>${sources("s4")}`;
    },
    s5() {
      return `${table(t.inputs_head, t.inputs)}<p class="note">${t.inputs_note}</p>`;
    },
    s6() {
      const n = t.tariff.length;
      return `<div class="tariff">
        <ol class="stairs">${t.tariff.map((r, i) => `<li class="${i >= n - 2 ? "fill" : ""}"><span class="lv">${r[0]}</span><span class="code" style="margin-left:${i * 10}px">${r[1]}</span><span class="d">${r[2]}</span></li>`).join("")}</ol>
        <div class="card gold codes">
          <div class="block"><p class="label">${t.code_mx[0]}</p><div class="big">2208.30.05.03</div><p>${t.code_mx[1]}</p><button class="copy" data-copy="2208.30.05.03">${t.copy}</button></div>
          <div class="block"><p class="label">${t.code_de[0]}</p><div class="big">2208 30 82 00</div><p>${t.code_de[1]}</p><button class="copy" data-copy="2208 30 82 00">${t.copy}</button></div>
        </div>
      </div>${sources("s6")}`;
    },
    s7() {
      const rows = PRICES.filter(r => state.market === "all" || r[0] === state.market).map(r => {
        let price;
        if (state.cur === "orig") price = r[5] === "MXN" ? mxn(r[4]) : eur(r[4]);
        else if (state.cur === "mxn") price = (r[5] === "MXN" ? "" : "≈ ") + mxn(r[5] === "MXN" ? r[4] : r[4] * RATE);
        else price = (r[5] === "EUR" ? "" : "≈ ") + eur(r[5] === "EUR" ? r[4] : r[4] / RATE);
        return `<tr><td>${t.markets[r[0]]}</td><td>${r[1]}${r[2] ? ` <span class="muted">${t.store_notes[r[2]]}</span>` : ""}</td><td>${r[3]} ml</td><td class="num">${price}</td></tr>`;
      }).join("");
      return `<div class="price-cards">${t.price_cards.map((c, i) => `<div class="card ${i === 1 ? "gold" : ""}"><p class="label">${c[0]}</p><strong>${c[1]}</strong><span>${c[2]}</span></div>`).join("")}</div>
        <div class="controls">
          <div class="seg" role="group">${["all", "MX", "DE"].map((m, i) => `<button data-market="${m}" aria-pressed="${state.market === m}">${t.filters[i]}</button>`).join("")}</div>
          <div class="seg" role="group">${["orig", "mxn", "eur"].map((c, i) => `<button data-cur="${c}" aria-pressed="${state.cur === c}">${t.currency[i]}</button>`).join("")}</div>
        </div>
        <div class="table-wrap"><table><thead><tr>${t.price_head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
        <p class="note">${t.price_note}</p>`;
    },
    s8() {
      return `${table(t.comp_head, t.comp)}
        <div class="two"><div class="card gold"><p class="label">${t.pros[0]}</p><p>${t.pros[1]}</p></div><div class="card"><p class="label">${t.cons[0]}</p><p>${t.cons[1]}</p></div></div>
        <p class="note">${t.comp_note}</p>${sources("s8")}`;
    },
    s9() {
      return `${table(t.nom_head, t.nom)}
        <div class="card" style="padding:22px;margin-top:18px"><p class="label">${t.nom_extra_title}</p><ul style="margin:0;padding-left:18px;color:var(--muted)">${t.nom_extra.map(x => `<li style="margin-bottom:6px">${x}</li>`).join("")}</ul></div>${sources("s9")}`;
    },
    s10() {
      const c = t.calc;
      return `<div class="duties">
        <div class="card gold zero"><p class="label">${t.zero[0]}</p><strong>${lang === "de" ? "0 %" : "0%"}</strong><p>${t.zero[1]}</p><p class="foot">${t.zero[2]}</p></div>
        <div class="pay">
          <p class="label" style="margin:0 0 2px">${t.pay_title}</p>
          ${t.pay.map(p => `<div class="card"><div><h3>${p[0]}</h3><p>${p[1]}</p></div><div class="val">${p[2]}</div></div>`).join("")}
          <div class="card" style="display:block"><p class="label">${t.tlcuem[0]}</p><p>${t.tlcuem[1]}</p></div>
        </div>
      </div>
      <div class="card calc">
        <div>
          <h3>${c.title}</h3><p class="muted" style="margin:-4px 0 18px">${c.sub}</p>
          <label class="field"><span>${c.value}</span><input type="number" min="0" step="0.5" id="c-value" value="${state.value}"></label>
          <label class="field"><span>${c.freight}</span><input type="number" min="0" step="0.1" id="c-freight" value="${state.freight}"></label>
          <label class="field"><span>${c.qty}</span><input type="number" min="1" step="1" id="c-qty" value="${state.qty}"></label>
          <label class="check"><input type="checkbox" id="c-2027" ${state.y2027 ? "checked" : ""}><span>${c.y2027}</span></label>
        </div>
        <div><div class="table-wrap"><table><thead><tr>${c.head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody id="calc-body"></tbody></table></div><p class="note">${c.note}</p></div>
      </div>${sources("s10")}`;
    },
    s11() {
      return `<div class="card gold alert"><span class="icon">!</span><p>${t.critical}</p></div>
        <div class="grid regs">${t.regs.map(r => `<div class="card item"><h3>${r[0]}</h3><p>${r[1]}</p></div>`).join("")}</div>${sources("s11")}`;
    },
    s12() {
      return `<div class="grid pack">${t.pack.map((p, i) => `<div class="card item ${i === 2 ? "gold" : ""}">${i === 0 ? `<img class="thumb" src="assets/botella-de.webp" alt="" loading="lazy">` : ""}<div class="n">${pad(i)}</div><h3>${p[0]}</h3><h3 class="plain">${p[1]}</h3><ul>${p[2].map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>
        <div class="card route" style="--p:${state.stop / 3}">
          <p class="label">${t.route_title}</p><p class="muted" style="margin:0">${t.route_hint}</p>
          <div class="stops-wrap"><span class="r-track"></span><span class="r-fill"></span>
            <ol class="stops">${t.route.map((r, i) => `<li><button class="stop ${i < state.stop ? "done" : ""}" data-stop="${i}" aria-pressed="${state.stop === i}"><span class="dot">${i + 1}</span><span class="name">${r[0]}</span></button></li>`).join("")}</ol>
          </div>
          <p class="route-detail swap"><strong>${t.route[state.stop][0]}.</strong> ${t.route[state.stop][1]}</p>
        </div>
        <p class="note">${t.pack_note}</p>`;
    },
    s13() {
      return `<details class="card bib"><summary>${t.bib_btn.replace("{n}", BIB.length)}</summary><ol>${BIB.map(b => `<li>${b.replace(/(https?:\/\/\S+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')}</li>`).join("")}</ol></details><p class="note">${t.bib_note}</p>`;
    }
  };

  function renderGallery() {
    const i = state.gal, g = GALLERY[i], c = t.gallery[i];
    $("#gallery").innerHTML = `
      <div class="card gal-main" id="gal-main">
        <button class="gal-nav prev" data-gal="-1" aria-label="${t.gal_prev}">‹</button>
        <img class="swap" src="${g.src}" alt="${c[0]}" width="${g.w}" height="${g.h}">
        <button class="gal-nav next" data-gal="1" aria-label="${t.gal_next}">›</button>
        <span class="gal-count">${i + 1} / ${GALLERY.length}</span>
      </div>
      <div class="gal-info" aria-live="polite">
        <p class="label">${pad(i)} / ${pad(GALLERY.length - 1)}</p>
        <h3>${c[0]}</h3>
        <p class="desc">${c[1]}</p>
        <div class="gal-thumbs" role="group">${GALLERY.map((x, k) => `<button data-gal-i="${k}" aria-pressed="${k === i}" aria-label="${t.gallery[k][0]}"><img src="${x.src}" alt="" loading="lazy"></button>`).join("")}</div>
      </div>`;
  }
  function galGo(i) { state.gal = (i + GALLERY.length) % GALLERY.length; renderGallery(); }

  function renderSection(id) {
    const sec = document.getElementById(id);
    $(".sec-head", sec).innerHTML = head(+id.slice(1) - 1, id === "s4" ? t.process_intro : "");
    $(".body", sec).innerHTML = R[id]();
    if (id === "s10") calc();
  }

  function calc() {
    const body = document.getElementById("calc-body");
    if (!body) return;
    const v = Math.max(0, +state.value || 0), f = Math.max(0, +state.freight || 0), q = Math.max(1, Math.round(+state.qty || 1));
    const alc = 1303 * 0.7 * 0.43 / 100 * (state.y2027 ? 1.2 : 1);
    const vat = 0.19 * (v + f + alc);
    const taxes = alc + vat;
    const rows = [0, alc, vat, taxes, v + f + taxes];
    body.innerHTML = rows.map((x, i) => `<tr class="${i === 4 ? "total" : ""}"><td>${t.calc.rows[i]}</td><td class="num">${eur(x)}</td><td class="num">${eur(x * q)}</td></tr>`).join("");
  }

  function render() {
    t = L[lang];
    document.documentElement.lang = lang;
    document.title = t.title;
    $$("[data-i18n]").forEach(el => { el.textContent = t[el.dataset.i18n]; });
    $$("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
    $("#stats").innerHTML = t.stats.map(s => `<div class="stat"><strong>${s[0]}</strong><span>${s[1]}</span></div>`).join("");
    const links = t.toc.map((x, i) => `<li><a href="#s${i + 1}"><b>${pad(i)}</b>${x}</a></li>`).join("");
    $("#toc-list").innerHTML = links;
    $("#menu-list").innerHTML = `<li><a href="#galeria"><b>◆</b>${t.gal_eyebrow}</a></li>` + links;
    $$("[data-i18n-alt]").forEach(el => { el.alt = t[el.dataset.i18nAlt]; });
    renderGallery();
    Object.keys(R).forEach(renderSection);
  }

  /* Eventos (delegados para que sigan funcionando tras cada render) */
  const menuBtn = $("#menu-btn"), menuPanel = $("#menu-panel");
  function toggleMenu(open = menuPanel.hidden) { menuPanel.hidden = !open; menuBtn.setAttribute("aria-expanded", open); }

  document.addEventListener("click", async e => {
    if (!menuPanel.hidden && !e.target.closest("#menu-panel, #menu-btn")) toggleMenu(false);
    const b = e.target.closest("button, a");
    if (!b) return;
    const d = b.dataset;
    if (d.lang) { lang = d.lang; store.set("lang", lang); render(); }
    else if (d.pres) { state.pres = +d.pres; renderSection("s2"); }
    else if (d.pin) { state.pin = d.pin; renderSection("s3"); }
    else if (b.id === "key-toggle") { state.onlyKey = !state.onlyKey; renderSection("s4"); }
    else if (d.market) { state.market = d.market; renderSection("s7"); }
    else if (d.cur) { state.cur = d.cur; renderSection("s7"); }
    else if (d.stop) { state.stop = +d.stop; renderSection("s12"); }
    else if (d.gal) { galGo(state.gal + +d.gal); }
    else if (d.galI) { galGo(+d.galI); }
    else if (d.copy) {
      try { await navigator.clipboard.writeText(d.copy); }
      catch (err) {
        const ta = document.createElement("textarea"); ta.value = d.copy; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch (e2) {} ta.remove();
      }
      b.textContent = t.copied; setTimeout(() => { b.textContent = t.copy; }, 1600);
    }
    else if (b.id === "menu-btn") toggleMenu();
    else if (b.closest("#menu-panel")) toggleMenu(false);
  });
  document.addEventListener("input", e => {
    const map = { "c-value": "value", "c-freight": "freight", "c-qty": "qty" };
    if (map[e.target.id]) { state[map[e.target.id]] = e.target.value; calc(); }
    if (e.target.id === "c-2027") { state.y2027 = e.target.checked; calc(); }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") toggleMenu(false);
    // Flechas del teclado para la galería cuando está en pantalla
    if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
      const r = $("#gallery").getBoundingClientRect();
      if (r.top < innerHeight && r.bottom > 0) galGo(state.gal + (e.key === "ArrowRight" ? 1 : -1));
    }
  });
  // Deslizar con el dedo en la galería
  let swipeX = null;
  document.addEventListener("pointerdown", e => { if (e.target.closest("#gal-main") && !e.target.closest("button")) swipeX = e.clientX; });
  document.addEventListener("pointerup", e => {
    if (swipeX === null) return;
    const dx = e.clientX - swipeX; swipeX = null;
    if (Math.abs(dx) > 40) galGo(state.gal + (dx < 0 ? 1 : -1));
  });

  // Verificación de edad
  const gate = $("#gate");
  if (store.get("age-ok") !== "1") { gate.hidden = false; document.body.style.overflow = "hidden"; }
  $("#gate-yes").addEventListener("click", () => { store.set("age-ok", "1"); gate.hidden = true; document.body.style.overflow = ""; });
  $("#gate-no").addEventListener("click", () => { $("#gate-denied").hidden = false; });

  render();

  // Animación al hacer scroll
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if ("IntersectionObserver" in window && !reduce) {
    const io = new IntersectionObserver(entries => entries.forEach(en => {
      if (!en.isIntersecting) return;
      en.target.classList.add("in"); io.unobserve(en.target);
    }), { threshold: .05 });
    $$(".reveal").forEach(el => io.observe(el));
  } else {
    $$(".reveal").forEach(el => el.classList.add("in"));
  }
  </script>
</body>
</html>
